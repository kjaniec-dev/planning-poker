events {
    worker_connections 1024;
}

http {
    upstream websocket_servers {
        # Use ip_hash for sticky sessions (same client → same backend)
        ip_hash;

        # Docker Compose will resolve these via DNS service discovery
        # Each replica gets a unique hostname
        server ws:3001 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://websocket_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            
            # Simple access logs to see which instance is being hit
            access_log /dev/stdout;
        }
    }
}
