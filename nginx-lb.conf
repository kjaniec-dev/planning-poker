events {
    worker_connections 1024;
}

http {
    # Use Docker's embedded DNS server for dynamic service discovery
    resolver 127.0.0.11 valid=10s;

    # Log format to see which backend handled the request
    log_format upstreamlog '$remote_addr - [$time_local] "$request" $status upstream: $upstream_addr';

    upstream websocket_servers {
        # IP-based sticky sessions - keeps clients from same IP on same server
        # Required because room state is stored in-memory on each server
        # Without this, room state would be fragmented across servers
        ip_hash;

        server ws:3001 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://websocket_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;

            # Use custom log format to see which backend handled the request
            access_log /dev/stdout upstreamlog;
        }
    }
}
