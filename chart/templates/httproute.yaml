{{- if .Values.httpRoute.enabled -}}
{{- $fullName := include "chart.fullname" . -}}
{{- $appSvcPort := .Values.service.port -}}
{{- $wsSvcPort := .Values.planningPoker.websocket.service.port -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- with .Values.httpRoute.parentRefs }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if and (eq .Values.planningPoker.mode "external") .Values.planningPoker.websocket.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /api/realtime
      backendRefs:
        - name: {{ $fullName }}-websocket
          port: {{ $wsSvcPort }}
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $fullName }}
          port: {{ $appSvcPort }}
{{- end }}
