{{- if .Values.ingress.enabled -}}
{{/*
DEPRECATION NOTICE: Kubernetes Ingress will be frozen and unmaintained from March 2026.
Please migrate to Gateway API (httpRoute) instead.
To enable Gateway API:
  1. Set httpRoute.enabled=true in values.yaml
  2. Configure httpRoute.parentRefs to reference your Gateway
  3. Set ingress.enabled=false
See: https://gateway-api.sigs.k8s.io/guides/migrating-from-ingress/
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            backend:
              service:
                name: {{ .serviceName | default (include "chart.fullname" $) }}
                port:
                  number: {{ .servicePort | default $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
