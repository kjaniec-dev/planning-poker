# Default values for planning-poker chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Number of replicas for the deployment
# For external mode with Redis, you can scale horizontally
replicaCount: 1

# Container image configuration
image:
  # Docker image repository
  # For Docker Hub: username/planning-poker
  # For other registries: registry.example.com/planning-poker
  repository: kjaniec/planning-poker
  # Image pull policy
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  # When empty, uses Chart.appVersion (1.0.0)
  tag: ""

# Secrets for pulling images from private registries
imagePullSecrets: []
# - name: my-registry-secret

# Override the chart name
nameOverride: ""
fullnameOverride: ""

# Planning Poker specific configuration
planningPoker:
  # Deployment mode: embedded or external
  # - embedded: WebSocket server runs inside Next.js (single container)
  # - external: Separate WebSocket server deployment (requires separate chart for WebSocket server)
  mode: external

  # WebSocket server language (only for external mode)
  # Options: node or golang
  language: node

  # Environment variables for the application
  env:
    # REALTIME_MODE: Set based on mode above
    # For embedded mode, this is set automatically
    # For external mode, specify the WebSocket server URL
    realtimeUrl: ""  # e.g., "http://planning-poker-websocket:3001"

    # Redis configuration (optional, for horizontal scaling)
    # If not set, runs in-memory mode
    redisUrl: ""  # e.g., "redis://redis-master:6379"

    # Allowed origins for CORS (comma-separated)
    allowedOrigins: ""  # e.g., "https://planning-poker.example.com"

    # Additional environment variables
    # Add any custom env vars here
    extra: {}
      # KEY: value

# Service account configuration
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Annotations to add to pods
podAnnotations: {}

# Labels to add to pods
podLabels: {}

# Pod security context
podSecurityContext:
  fsGroup: 2000
  runAsNonRoot: true
  runAsUser: 1000

# Container security context
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false

# Service configuration
service:
  # Service type: ClusterIP, NodePort, or LoadBalancer
  type: ClusterIP
  # Service port (Planning Poker runs on port 3000)
  port: 3000
  # Target port on the container
  targetPort: 3000
  # Session affinity configuration
  # Recommended: Enable for WebSocket connections to maintain room state on same pod
  sessionAffinity:
    enabled: true
    # Session timeout in seconds (default: 3 hours)
    timeoutSeconds: 10800

# Ingress configuration
# DEPRECATED: Kubernetes Ingress will be frozen and unmaintained from March 2026
# Please migrate to Gateway API (httpRoute configuration below) instead
# See: https://gateway-api.sigs.k8s.io/guides/migrating-from-ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # For NGINX Ingress Controller - enable WebSocket support and sticky sessions
    # nginx.ingress.kubernetes.io/websocket-services: planning-poker
    # nginx.ingress.kubernetes.io/affinity: "cookie"
    # nginx.ingress.kubernetes.io/session-cookie-name: "route"
    # nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"
  hosts:
    - host: planning-poker.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: planning-poker-tls
    #   hosts:
    #     - planning-poker.example.com

# Gateway API HTTPRoute configuration (RECOMMENDED)
# Gateway API is the successor to Ingress and is the recommended approach
# Requires Gateway API CRDs installed in your cluster
# See: https://gateway-api.sigs.k8s.io/
#
# Installation:
#   kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml
#
# For WebSocket support and sticky sessions, configure your Gateway with:
#   - Session affinity/persistence (implementation-specific)
#   - HTTP/1.1 upgrade protocol support for WebSocket connections
httpRoute:
  enabled: false
  annotations: {}
    # Example annotations for cert-manager
    # cert-manager.io/cluster-issuer: letsencrypt-prod

  # Reference to the parent Gateway resource
  # The Gateway must exist in your cluster and be properly configured
  parentRefs:
  - name: gateway              # Name of your Gateway resource
    namespace: default         # Namespace where Gateway is deployed (optional, defaults to same namespace)
    sectionName: http          # Listener name on the Gateway (e.g., http, https)
    # For HTTPS/TLS:
    # - name: gateway
    #   sectionName: https

  # Hostnames that this HTTPRoute should match
  # Must be configured on the parent Gateway's listeners
  hostnames:
  - planning-poker.example.com

  # Routing rules for matching requests and forwarding to backends
  # The service backend is automatically configured to point to this chart's service
  rules:
  - matches:
    - path:
        type: PathPrefix       # PathPrefix, Exact, or RegularExpression
        value: /
    # Optional: Add filters for request/response manipulation
    # filters:
    # - type: RequestHeaderModifier
    #   requestHeaderModifier:
    #     add:
    #     - name: X-Custom-Header
    #       value: "planning-poker"

  # Example: Multiple rules for different paths
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /api
  #   filters:
  #   - type: URLRewrite
  #     urlRewrite:
  #       path:
  #         type: ReplacePrefixMatch
  #         replacePrefixMatch: /v1

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Liveness probe configuration
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Readiness probe configuration
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Horizontal Pod Autoscaler configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Additional volumes
volumes: []
# - name: tmp
#   emptyDir: {}

# Additional volume mounts
volumeMounts: []
# - name: tmp
#   mountPath: /tmp

# Node selector for pod assignment
nodeSelector: {}

# Tolerations for pod assignment
tolerations: []

# Affinity rules for pod assignment
affinity: {}

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# Network Policy
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []